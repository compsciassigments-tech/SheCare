<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - SheCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="mb-4">She-Care Admin Dashboard</h2>

    <table class="table table-bordered table-striped">
        <thead class="table-danger">
            <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Issue</th>
                <th>Category</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
       <tbody>
    {% for row in complaints %}
    <tr>
        <td>{{ row[0] }}</td>  <!-- ID -->
        <td>{{ row[1] }}</td>  <!-- Student ID -->
        <td>{{ row[3] }}</td>  <!-- Issue -->
        <td>{{ row[4] }}</td>  <!-- Category -->
        <td>{{ row[5] }}</td>  <!-- Priority -->
        <td>{{ row[7] }}</td>  <!-- Status -->
        <td>
            {% if row[7] != "Resolved" %}
            <a href="/resolve/{{ row[0] }}" class="btn btn-success btn-sm">Mark Resolved</a>
            {% else %}
            <span class="text-success">Done</span>
            {% endif %}
        </td>
    </tr>
    {% endfor %}
</tbody>
    </table>

    <a href="/logout" class="btn btn-secondary">Logout</a>
</div>

</body>
</html>
